[package]
name = "sequon-io"
description = "Format adapters between sequence files and the Sequon canonical model"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["genbank"]
# GenBank reader and writer. No extra dependency.
genbank = []
# SnapGene .dna reader (import-only). General-purpose codecs only.
snapgene = ["dep:lzma-rs", "dep:quick-xml"]

[dependencies]
sequon-model = { workspace = true }
sequon-algo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# General-purpose codecs, enabled only by the snapgene feature. Versions and
# licences are recorded in docs/design/snapgene-dna.md.
lzma-rs = { version = "=0.3.0", optional = true }
quick-xml = { version = "=0.42.0", default-features = false, optional = true }

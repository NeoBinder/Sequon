[package]
name = "sequon-conformance"
description = "Development-only conformance harness for Sequon schemas, fixtures and cross-format comparison"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Development tool only: not in the runtime dependency tree, not published, and
# never a dependency of sequon-model/sequon-io/sequon-algo.
#
# Versions verified 2026-10-21 with cargo 1.97.1:
# - serde 1.0.229 (MIT OR Apache-2.0), inherited from the workspace, for report
#   serialization;
# - serde_json 1.0.154 (MIT OR Apache-2.0), inherited from the workspace, for
#   --json output and test parsing;
# - jsonschema 0.59.0 (MIT), dev-dependency only, default features disabled:
#   the schemas are self-contained, so no HTTP retriever or TLS stack is needed.
#   It is reachable only from this publish = false harness; the library crates
#   and every published tree stay free of it. All crates in its wasi target
#   chain are permissively licensed, so deny.toml needs no exception.
# - sha2 0.10.9 (MIT OR Apache-2.0), inherited from the workspace, dev-only, used
#   by the fixture determinism test;
# - lzma-rs =0.3.0 (MIT, 2023-01-04), documented in docs/design/snapgene-dna.md
#   section 2.2 and pinned exactly for the history-packet builder;
# - sequon-io (genbank + snapgene features), sequon-model and sequon-algo are
#   normal dependencies because the compare module and the sequon-conformance
#   binary import, validate and digest-check records. They are the workspace's
#   own crates, not new third-party dependencies; this crate remains
#   publish = false and absent from every runtime tree.
#
# Do not add other dependencies here without a design note. The harness must
# stay small and must never become a runtime dependency of the library crates.
[dependencies]
lzma-rs = { version = "=0.3.0", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
sequon-io = { workspace = true, features = ["genbank", "snapgene"] }
sequon-model = { workspace = true }
sequon-algo = { workspace = true }

[dev-dependencies]
jsonschema = { version = "0.59.0", default-features = false }
sha2 = { workspace = true }

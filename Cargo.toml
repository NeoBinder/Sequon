[workspace]
resolver = "2"
members = [
    "crates/sequon-model",
    "crates/sequon-io",
    "crates/sequon-algo",
    "crates/sequon-conformance",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/NeoBinder/Sequon"
homepage = "https://github.com/NeoBinder/Sequon"
authors = ["NeoBinder contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
sequon-model = { path = "crates/sequon-model" }
sequon-io = { path = "crates/sequon-io" }
sequon-algo = { path = "crates/sequon-algo" }
